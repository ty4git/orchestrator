filebeat.inputs:
- type: filestream
  id: filebeat-manager-logs
  enabled: true
  paths:
    - /mnt/applogs/orchestrator.log
  parsers:
    - ndjson:
        keys_under_root: true
        overwrite_keys: true
        message_key: "msg"
        add_error_key: true

