setup.template.name: "orchestrator"
setup.template.pattern: "orchestrator-index-*"

#----------------------------- Processors ------------------------------------------
processors:
  - add_docker_metadata: ~

#----------------------------- Elasticsearch output --------------------------------
output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "orchestrator-index-%{+yyyy.MM.dd}"
  username: "elastic"
  password: "${ES_PASSWORD}"

# output.console:
#   pretty: true

#----------------------------- Logging --------------------------------
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat-input
  keepfiles: 7
  permissions: 0644