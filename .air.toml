root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
    args_bin = []
    bin = "./tmp/main -name=manager"
    cmd = "go build -o ./tmp/main ."
    delay = 1000
    exclude_dir = ["assets", "tmp", "vendor", "requests", "tests", "echo"]
    exclude_file = []
    exclude_regex = ["_test.go"]
    follow_symlink = false
    full_bin = ""
    include_dir = []
    include_ext = ["go", "tpl", "tmpl", "html"]
    include_file = []
    kill_delay = "2s"
    log = "build-errors.log"
    send_interrupt = false
    stop_on_error = true

[log]
    main_only = false
    time = false

[color]
    app = ""
    build = "yellow"
    main = "magenta"
    runner = "green"
    watcher = "cyan"

[misc]
    clean_on_exit = false